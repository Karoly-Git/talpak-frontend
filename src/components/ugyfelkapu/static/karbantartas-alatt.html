<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Karbantartás</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            background-color: #fff;
            padding: 40px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            max-width: 600px;
            margin: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
        }
        .icon {
            font-size: 50px;
            color: #ff9900;
            margin-bottom: 20px;
        }
        footer {
            margin-top: 20px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">⚠️</div>
        <h1>Hamarosan visszatérünk!</h1>
        <p>Elnézést a kellemetlenségért, de weboldalunk jelenleg karbantartás alatt áll. Keményen dolgozunk azon, hogy rövidesen újra elérhető legyen.</p>
        <p>Köszönjük türelmét!</p>
        <footer>&copy; 2024 Talpak.hu</footer>
    </div>

</body>
</html>
